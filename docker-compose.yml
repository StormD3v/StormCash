version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stormcash-postgres
    environment:
      POSTGRES_USER: stormcash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: stormcash
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stormcash -d stormcash"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
